<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>异常收录档案 - 在线联机版</title>
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="renderer" content="webkit">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 微软雅黑, Microsoft YaHei, sans-serif; }
body { background: #0b0f17; color: #e6e6e6; min-height: 100vh; }
.nav { background: #121822; padding: 14px 20px; border-bottom: 1px solid #242a36; position: sticky; top: 0; z-index: 99; }
.nav .wrap { max-width: 1000px; margin: 0 auto; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.nav .title { font-size: 20px; font-weight: 700; color: #58a6ff; }
.nav a { color: #aaa; text-decoration: none; padding: 6px 0; border-bottom: 2px solid transparent; }
.nav a.active { color: #58a6ff; border-color: #58a6ff; }
.nav .right { margin-left: auto; display: flex; gap: 12px; }
.container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
.login { max-width: 420px; margin: 60px auto; background: #121822; border: 1px solid #242a36; border-radius: 12px; padding: 30px; text-align: center; }
.login h2 { color: #58a6ff; margin-bottom: 20px; }
.login input { width: 100%; padding: 12px; margin: 8px 0; background: #0b0f17; border: 1px solid #242a36; border-radius: 6px; color: #fff; pointer-events: auto; user-select: text; }
.login button { width: 100%; padding: 12px; background: #238636; border: none; border-radius: 6px; color: #fff; margin-top: 10px; cursor: pointer; }
.login .dev { margin-top: 20px; color: #666; font-size: 13px; }
.card { background: #121822; border: 1px solid #242a36; border-radius: 10px; padding: 20px; margin-bottom: 16px; }
.card .tag { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; margin-right: 8px; }
.tag-cthulhu { background: #8957e5; color: #fff; }
.tag-greenapple { background: #3fb950; color: #fff; }
.tag-normal { background: #58a6ff; color: #fff; }
.card h3 { margin: 10px 0; color: #fff; }
.card .meta { color: #777; font-size: 13px; margin-bottom: 10px; }
.card .content { color: #ccc; line-height: 1.7; white-space: pre-wrap; }
.card img { max-width: 100%; border-radius: 6px; margin-top: 10px; max-height: 400px; object-fit: contain; }
.upload { background: #121822; border: 1px solid #242a36; border-radius: 12px; padding: 30px; }
.upload h2 { color: #58a6ff; margin-bottom: 20px; }
.upload .item { margin-bottom: 18px; }
.upload label { display: block; margin-bottom: 6px; }
.upload input, .upload textarea, .upload select { width: 100%; padding: 12px; background: #0b0f17; border: 1px solid #242a36; border-radius: 6px; color: #fff; pointer-events: auto; user-select: text; }
.upload textarea { min-height: 180px; resize: vertical; }
.upload button { padding: 12px 30px; background: #238636; border: none; border-radius: 6px; color: #fff; cursor: pointer; }
.empty { text-align: center; padding: 60px 20px; color: #666; }
.admin-bar { margin-top: 12px; display: flex; gap: 8px; }
.admin-btn { background: #d32f2f; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
.ban-btn { background: #f57c00; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
.sync-tip { text-align: center; color: #4ade80; margin: 10px 0; font-size: 14px; }
input, textarea, select { -webkit-user-select: text !important; user-select: text !important; pointer-events: auto !important; }
</style>
</head>
<body>

<div class="nav">
  <div class="wrap">
    <div class="title">异常收录档案</div>
    <a href="#" class="page" data-target="home">首页</a>
    <a href="#" class="page" data-target="cthulhu">克苏鲁</a>
    <a href="#" class="page" data-target="greenapple">青苹果</a>
    <a href="#" class="page" data-target="normal">通用异常</a>
    <div class="right">
      <a href="#" class="page" id="uploadPage" style="display:none" data-target="upload">上传</a>
      <a href="#" class="page" id="loginBtn" data-target="login">登录</a>
      <a href="#" id="adminBtn" style="display:none;cursor:pointer">管理员模式</a>
      <a href="#" id="logoutBtn" style="display:none">退出</a>
    </div>
  </div>
</div>

<div class="container" id="view"></div>

<script>
// 在线同步核心：JSONBin 免费云端存储（跨设备联机）
const BIN_ID = "6607f2e4acd3cb34a88f0a52";
const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`;
const UPDATE_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
const ADMIN_KEY = "susu";
const ADMIN_NAME = "susu";

let currentUser = localStorage.getItem("user") || null;
let adminMode = false;
let banned = JSON.parse(localStorage.getItem("banned") || "[]");
let currentPage = "home";
let posts = [];

// 每3秒自动同步（真正联机核心）
setInterval(fetchPosts, 3000);

// 读取云端数据
async function fetchPosts() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    posts = data.record.posts || [];
    localStorage.setItem("local_posts", JSON.stringify(posts));
    render(currentPage);
  } catch (e) {
    posts = JSON.parse(localStorage.getItem("local_posts") || "[]");
    render(currentPage);
  }
}

// 保存到云端
async function savePosts() {
  try {
    await fetch(UPDATE_URL, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ posts: posts })
    });
    fetchPosts();
  } catch (e) {
    localStorage.setItem("local_posts", JSON.stringify(posts));
    render(currentPage);
  }
}

// 页面激活状态
function setActive(page) {
  currentPage = page;
  document.querySelectorAll(".page").forEach(a => a.classList.remove("active"));
  document.querySelectorAll(`.page[data-target="${page}"]`).forEach(a => a.classList.add("active"));
}

// 页面渲染
function render(page) {
  setActive(page);
  const view = document.getElementById("view");
  
  // 登录页
  if (page === "login") {
    view.innerHTML = `
    <div class="login">
      <h2>异常档案系统登录</h2>
      <input id="user" placeholder="请输入用户名" type="text">
      <input id="pwd" placeholder="密码（无需填写）" type="password">
      <button onclick="login()">登录系统</button>
      <div class="dev">开发者：做头发呀</div>
    </div>`;
    return;
  }
  
  // 上传页
  if (page === "upload") {
    if (!currentUser) {
      render("login");
      alert("请先登录后再上传档案！");
      return;
    }
    
    view.innerHTML = `
    <div class="upload">
      <h2>上传异常档案</h2>
      <div class="item">
        <label>档案标题</label>
        <input id="title" placeholder="请输入档案标题" type="text">
      </div>
      <div class="item">
        <label>档案分类</label>
        <select id="type">
          <option value="cthulhu">克苏鲁档案</option>
          <option value="greenapple">青苹果档案</option>
          <option value="normal">通用异常档案</option>
        </select>
      </div>
      <div class="item">
        <label>档案内容</label>
        <textarea id="content" placeholder="请输入详细的异常描述..."></textarea>
      </div>
      <div class="item">
        <label>相关图片（可选）</label>
        <input type="file" id="img" accept="image/*">
      </div>
      <button onclick="submitPost()">提交收录</button>
    </div>`;
    return;
  }
  
  // 帖子列表
  const filteredPosts = page === "home" ? posts : posts.filter(post => post.type === page);
  
  if (filteredPosts.length === 0) {
    view.innerHTML = `<div class="empty">暂无收录的异常档案</div>`;
    return;
  }
  
  let html = `<div class="sync-tip">🔄 实时联机已开启 · 共 ${filteredPosts.length} 条档案</div>`;
  filteredPosts.forEach(post => {
    const tagClass = post.type === "cthulhu" ? "tag-cthulhu" : 
                     post.type === "greenapple" ? "tag-greenapple" : "tag-normal";
    const tagText = post.type === "cthulhu" ? "克苏鲁档案" : 
                    post.type === "greenapple" ? "青苹果档案" : "通用异常";
    
    let adminTools = "";
    if (adminMode) {
      adminTools = `
      <div class="admin-bar">
        <button class="admin-btn" onclick="deletePost('${post.id}')">删除档案</button>
        <button class="ban-btn" onclick="banUser('${post.user}')">封禁作者</button>
      </div>`;
    }
    
    html += `
    <div class="card">
      <span class="${tagClass}">${tagText}</span>
      <h3>${post.title}</h3>
      <div class="meta">作者：${post.user} · 收录时间：${post.time}</div>
      <div class="content">${post.content}</div>
      ${post.img ? `<img src="${post.img}" alt="${post.title}">` : ""}
      ${adminTools}
    </div>`;
  });
  
  view.innerHTML = html;
}

// 登录
function login() {
  const username = document.getElementById("user").value.trim();
  if (!username) return alert("请输入用户名！");
  if (banned.includes(username)) return alert("该账号已被管理员封禁，无法登录！");
  
  currentUser = username;
  localStorage.setItem("user", username);
  updateNavbar();
  render("home");
  alert(`欢迎 ${username}！`);
}

// 退出登录
function logout() {
  currentUser = null;
  adminMode = false;
  localStorage.removeItem("user");
  updateNavbar();
  render("login");
  alert("已退出登录！");
}

// 提交帖子
function submitPost() {
  const title = document.getElementById("title").value.trim();
  const content = document.getElementById("content").value.trim();
  const type = document.getElementById("type").value;
  const fileInput = document.getElementById("img");
  const file = fileInput.files[0];
  
  if (!title || !content) return alert("标题和内容不能为空！");
  
  const handleImage = (imgData) => {
    const newPost = {
      id: Date.now().toString(),
      title: title,
      content: content,
      type: type,
      user: currentUser,
      time: new Date().toLocaleString(),
      img: imgData || ""
    };
    
    posts.unshift(newPost);
    savePosts();
    alert("✅ 档案上传成功！");
    render("home");
  };
  
  if (file) {
    const reader = new FileReader();
    reader.onload = (e) => handleImage(e.target.result);
    reader.readAsDataURL(file);
  } else {
    handleImage("");
  }
}

// 删除帖子
function deletePost(postId) {
  if (!adminMode) return alert("请先开启管理员模式！");
  if (confirm("确定删除这条档案？")) {
    posts = posts.filter(post => post.id !== postId);
    savePosts();
    alert("❌ 档案已删除！");
  }
}

// 封禁用户
function banUser(username) {
  if (!adminMode) return alert("请先开启管理员模式！");
  if (username === ADMIN_NAME) return alert("不能封禁管理员！");
  
  if (confirm(`确定封禁用户 ${username}？`)) {
    if (!banned.includes(username)) banned.push(username);
    localStorage.setItem("banned", JSON.stringify(banned));
    alert(`🚫 用户 ${username} 已封禁！`);
    render(currentPage);
  }
}

// 切换管理员模式
function toggleAdmin() {
  if (currentUser !== ADMIN_NAME) return alert("仅管理员susu可进入！");
  const key = prompt("请输入管理员秘钥：");
  if (key === ADMIN_KEY) {
    adminMode = !adminMode;
    alert(`管理员模式：${adminMode ? "✅ 开启" : "❌ 关闭"}`);
    render(currentPage);
  } else {
    alert("秘钥错误！管理员秘钥是susu");
  }
}

// 更新导航栏
function updateNavbar() {
  document.getElementById("loginBtn").style.display = currentUser ? "none" : "inline-block";
  document.getElementById("uploadPage").style.display = currentUser ? "inline-block" : "none";
  document.getElementById("logoutBtn").style.display = currentUser ? "inline-block" : "none";
  document.getElementById("adminBtn").style.display = (currentUser === ADMIN_NAME) ? "inline-block" : "none";
}

// 初始化
document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll(".page").forEach(link => {
    link.addEventListener("click", (e) => {
      e.preventDefault();
      render(link.dataset.target);
    });
  });
  document.getElementById("adminBtn").addEventListener("click", toggleAdmin);
  document.getElementById("logoutBtn").addEventListener("click", logout);
  updateNavbar();
  fetchPosts();
});
</script>
</body>
</html>
